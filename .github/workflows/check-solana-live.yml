name: Verify Deployed Solana Feed
on:
  pull_request:
    paths:
      - 'scripts/check-solana-live.mjs'
      - '.github/workflows/check-solana-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-solana-live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm public Solana RPC returns genuine new signatures
        run: node scripts/check-solana-live.mjs
