name: Test BEXENTRA Cloudflare Stream
on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/test-cloudflare-stream.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Workers script syntax
        run: node --check cloudflare/src/worker.js
      - name: Test SSE streaming, RPC notifications, error and memory limits
        working-directory: cloudflare
        run: node --test test/*.test.mjs
