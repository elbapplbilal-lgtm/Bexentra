name: Test BEXENTRA Neon Mobile Dashboard
on:
  pull_request:
    paths:
      - 'public/neon-reference-v5.css'
      - 'public/detail-nav-rescue.css'
      - 'explorer.html'
      - 'public/neon-reference-v6.css'
      - 'public/bnb-mark.svg'
      - 'public/feature-icons-3d.svg'
      - 'public/app.js'
      - 'index.html'
      - 'sw.js'
      - 'scripts/test-neon-layout.mjs'
      - '.github/workflows/test-neon-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools (no backend tokens required)
        run: npm install --no-save --no-audit --no-fund playwright css-tree
      - name: Verify installed system Chrome
        run: google-chrome --version
      - name: Test working real DOM with test-only blockchain fixtures at Android, tablet and desktop-site widths
        run: node scripts/test-neon-layout.mjs
      - name: Save browser screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bexentra-neon-ui-previews
          path: ui-test-shots/*.png
          if-no-files-found: ignore
          retention-days: 7
