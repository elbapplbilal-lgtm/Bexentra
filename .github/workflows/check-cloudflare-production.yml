name: Verify BEXENTRA Cloudflare Production
on:
  pull_request:
    paths:
      - 'scripts/check-cloudflare-production.mjs'
      - '.github/workflows/check-cloudflare-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare Production /health externally
        run: node scripts/check-cloudflare-production.mjs
