name: BEXENTRA Bounded Historical Backfill
on:
  workflow_dispatch:
  schedule:
    - cron: '13 4 * * *'
permissions:
  contents: read
concurrency:
  group: bexentra-historical-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BNB_RPC_URL: ${{ secrets.BNB_RPC_URL }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      BACKFILL_BNB_BLOCKS: '6'
      BACKFILL_SOL_BLOCKS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure database configured
        run: test -n "$DATABASE_URL"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify historical range and hash-validation tests
        run: npm test
      - name: Backfill a few older finalized blocks without overwriting indexed data
        run: timeout --signal=TERM --kill-after=10s 120s node src/backfill.js
