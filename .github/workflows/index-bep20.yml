name: BEXENTRA BEP20 Transfer Indexer

on:
  workflow_dispatch:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'

permissions:
  contents: read

concurrency:
  group: bexentra-bep20-indexer
  cancel-in-progress: false

jobs:
  index-token-transfers:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BNB_RPC_URL: ${{ secrets.BNB_RPC_URL }}
      TOKEN_INDEXER_POLL_MS: '2500'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify database secret exists
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing DATABASE_URL secret"
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test Transfer event parsing before live index writes
        run: node --test test/token-transfer-batch.test.js
      - name: Index BEP20 Transfer events
        # Give the indexer enough time to commit the current bulk batch on TERM.
        # Non-timeout errors and forced SIGKILL must still fail the job.
        run: timeout --signal=TERM --kill-after=30s 225s node src/token-indexer.js || test "$?" -eq 124
