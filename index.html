
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bexentra | مستكشف البلوك تشين</title>
<link rel="stylesheet" href="public/style.css">
</head>
<body>
<header>
  <h2>🔷 BEXENTRA</h2>
  <p>مستكشف البلوك تشين</p>
</header>

<main>
  <section class="card">
    <h1>استكشف عالم البلوك تشين</h1>
    <p>ابحث عن محفظة على شبكة Solana</p>
    <input id="searchInput" placeholder="أدخل عنوان المحفظة">
    <button onclick="searchBlockchain()">🔍 بحث</button>
    <div id="result"></div>
  </section>

  <section class="card">
    <h2>🌐 الشبكات</h2>
    <p>Solana — البحث عن المحافظ</p>
    <p>BNB Chain — قريباً</p>
  </section>

  <section class="card">
    <h2>📊 العملات الرقمية</h2>
    <p>Bitcoin (BTC)</p>
    <p>Ethereum (ETH)</p>
    <p>Solana (SOL)</p>
    <p>BNB</p>
    <small>الأسعار المباشرة لم تُفعّل بعد.</small>
  </section>

  <section class="card">
    <h2>⚙️ الإعدادات</h2>
    <p>اللغة: العربية</p>
    <p>التصميم: أزرق وأبيض</p>
  </section>
</main>

<script src="public/app.js"></script>
</body>
</html>
